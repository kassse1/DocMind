[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "docmind"
version = "0.1.0"
description = "Document ingestion, semantic search and RAG with validated citations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    # Upload parsing. Upper bounds: a parser major release can silently change extracted text.
    "python-multipart>=0.0.18,<0.1",  # required by FastAPI for multipart/UploadFile
    "pymupdf>=2.0,<3",                # PDF text with page numbers (AGPL-3.0 license)
    "python-docx>=1.1,<2",            # DOCX paragraphs and tables
    "numpy>=2.0",                     # embedding vectors
    "pgvector>=0.5,<0.6",             # SQLAlchemy Vector type for the pgvector extension
    "httpx>=0.27",                    # OpenAI-compatible generation client (RAG)
]

[project.optional-dependencies]
# Local embedding model for the indexing worker (pulls in PyTorch: hundreds of MB).
# Not needed for the API or the default test suite, which use a fake embedder.
embeddings = [
    "sentence-transformers>=6.2,<7",
]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.evaluation" = ["datasets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: needs a real PostgreSQL database (set DOCMIND_TEST_DATABASE_URL)",
    "model: loads the real embedding model (set DOCMIND_RUN_MODEL_TESTS=1)",
    "llm: calls a real local generation model via Ollama (set DOCMIND_RUN_LLM_TESTS=1)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends() in argument defaults is idiomatic.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.ruff.lint.isort]
# The local alembic/ migrations folder would otherwise make ruff treat the package as first-party.
known-third-party = ["alembic"]
